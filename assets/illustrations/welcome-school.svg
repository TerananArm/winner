      <stop offset="0%" stop-color="#fff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="wg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0.1"/>
    </linearGradient>
  </defs>
  <!-- Building -->
  <rect x="100" y="50" width="120" height="130" rx="8" fill="url(#wg1)" stroke="#fff" stroke-opacity="0.2" stroke-width="1"/>
  <rect x="80" y="40" width="160" height="15" rx="4" fill="url(#wg1)"/>
  <!-- Windows grid -->
  <rect x="115" y="65" width="20" height="18" rx="3" fill="#fff" fill-opacity="0.25"/>
  <rect x="145" y="65" width="20" height="18" rx="3" fill="#fff" fill-opacity="0.15"/>
  <rect x="175" y="65" width="20" height="18" rx="3" fill="#fff" fill-opacity="0.3"/>
  <rect x="115" y="93" width="20" height="18" rx="3" fill="#fff" fill-opacity="0.15"/>
  <rect x="145" y="93" width="20" height="18" rx="3" fill="#fff" fill-opacity="0.3"/>
  <rect x="175" y="93" width="20" height="18" rx="3" fill="#fff" fill-opacity="0.2"/>
  <rect x="115" y="121" width="20" height="18" rx="3" fill="#fff" fill-opacity="0.3"/>
