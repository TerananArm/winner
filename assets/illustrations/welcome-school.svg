    <line x1="5" y1="8" x2="20" y2="8" stroke="#fff" stroke-opacity="0.2" stroke-width="1"/>
    <line x1="5" y1="13" x2="17" y2="13" stroke="#fff" stroke-opacity="0.15" stroke-width="1"/>
    <line x1="5" y1="18" x2="19" y2="18" stroke="#fff" stroke-opacity="0.1" stroke-width="1"/>
