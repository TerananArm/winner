  <line x1="160" y1="10" x2="160" y2="40" stroke="#fff" stroke-opacity="0.3" stroke-width="1.5"/>
  <path d="M160 12h20v10h-20" fill="#fff" fill-opacity="0.2"/>
  <!-- Graduation cap floating -->
  <g transform="translate(250,30)" opacity="0.8">
    <path d="M0 15L20 5L40 15L20 25Z" fill="url(#wg2)"/>
